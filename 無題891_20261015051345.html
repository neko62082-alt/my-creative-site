<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHARACTER FILE 001</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            background-color: #171716;
            color: #d1cfca;
            font-family: "Zen Maru Gothic", sans-serif;
            line-height: 1.9;
            letter-spacing: 0.06em;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .back {
            color: #cbaab5;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #ffffff;
        }

        .file-number {
            margin-top: 35px;
            color: #8d777e;
            font-size: 11px;
            letter-spacing: 0.2em;
        }

        h1 {
            margin-top: 5px;
            color: #e6d8dc;
            font-size: 28px;
            font-weight: 500;
        }

        /* 上の立ち絵 */
        .portrait {
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            margin: 25px auto;
            border: 1px solid #76616a;
            box-sizing: border-box;
        }

        /* 下のイラストとミニキャラの配置 */
        .mini-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            margin: 40px auto 25px;
        }

        /* 下の大きなイラスト */
        .main-illustration {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #76616a;
            box-sizing: border-box;
        }

        /* つまんで動かせるミニキャラ */
        .mini-character {
            position: absolute;
            width: 90px;
            height: auto;
            top: -25px;
            left: -20px;

            animation: mini-wiggle 1.2s ease-in-out infinite;
            transform-origin: bottom center;
            z-index: 2;

            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* つまんでいる間は揺れを止める */
        .mini-character.dragging {
            animation: none;
            cursor: grabbing;
        }

        /* 左右にピコピコ揺れる動き */
        @keyframes mini-wiggle {
            0%, 100% {
                transform: rotate(-8deg) translateX(-3px);
            }

            50% {
                transform: rotate(8deg) translateX(3px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .mini-character {
                animation: none;
            }
        }

        h2 {
            margin-top: 35px;
            padding-bottom: 5px;
            border-bottom: 1px solid #51494a;
            color: #cbaab5;
            font-size: 16px;
            font-weight: 500;
        }

        .info {
            font-size: 14px;
        }

        .label {
            color: #a58c95;
            display: inline-block;
            min-width: 85px;
        }

        .description {
            font-size: 14px;
            line-height: 2;
        }

        .bottom {
            margin-top: 50px;
            padding-top: 15px;
            border-top: 1px solid #51494a;
            text-align: center;
            font-size: 11px;
            color: #766d6e;
        }
    </style>
</head>

<body>
    <main class="container">

        <a class="back" href="index.html">← BACK TO TOP</a>

        <p class="file-number">CHARACTER FILE / 001</p>

        <h1>シルヴァン</h1>

        <!-- 上の立ち絵 -->
        <img
            class="portrait"
            src="無題891_20261015051345.png"
            alt="シルヴァンの立ち絵"
        >

        <!-- 下のイラストとミニキャラ -->
        <div class="mini-container">

            <img
                class="main-illustration"
                src="シルヴァン.PNG"
                alt="シルヴァンの別イラスト"
            >

            <img
                class="mini-character"
                src="mini.PNG"
                alt="つまんで動かせるミニキャラ"
                draggable="false"
            >

        </div>

        <h2>PROFILE</h2>

        <div class="info">
            <p><span class="label">NAME</span> シルヴァン</p>
            <p><span class="label">AGE</span> 38歳</p>
            <p><span class="label">HEIGHT</span> 184cm</p>
            <p><span class="label">GENDER</span> 性別を入力</p>
        </div>

        <h2>PERSONALITY</h2>

        <p class="description">
            ここにキャラクターの性格を書く。
            好きなものや嫌いなもの、普段の様子など。
        </p>

        <h2>BACKGROUND</h2>

        <p class="description">
            ここにキャラクターの過去や設定を書く。
            秘密にしておきたい情報を書くのもあり。
        </p>

        <div class="bottom">
            CHARACTER ARCHIVE
        </div>

    </main>

    <!-- ミニキャラをつまんで移動する機能 -->
    <script>
        const mini = document.querySelector(".mini-character");
        const container = document.querySelector(".mini-container");

        let dragging = false;
        let startX = 0;
        let startY = 0;
        let originalLeft = 0;
        let originalTop = 0;

        mini.addEventListener("pointerdown", function(event) {
            dragging = true;

            startX = event.clientX;
            startY = event.clientY;

            originalLeft = mini.offsetLeft;
            originalTop = mini.offsetTop;

            mini.classList.add("dragging");

            mini.setPointerCapture(event.pointerId);

            event.preventDefault();
        });

        mini.addEventListener("pointermove", function(event) {
            if (!dragging) return;

            const moveX = event.clientX - startX;
            const moveY = event.clientY - startY;

            mini.style.left = (originalLeft + moveX) + "px";
            mini.style.top = (originalTop + moveY) + "px";
        });

        function stopDragging() {
            if (!dragging) return;

            dragging = false;
            mini.classList.remove("dragging");
        }

        mini.addEventListener("pointerup", stopDragging);
        mini.addEventListener("pointercancel", stopDragging);
    </script>

</body>
</html>
