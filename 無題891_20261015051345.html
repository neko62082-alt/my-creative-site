<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHARACTER FILE 001</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            background-color: #171716;
            color: #d1cfca;
            font-family: "Zen Maru Gothic", sans-serif;
            line-height: 1.9;
            letter-spacing: 0.06em;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .back {
            color: #cbaab5;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #ffffff;
        }

        .file-number {
            margin-top: 35px;
            color: #8d777e;
            font-size: 11px;
            letter-spacing: 0.2em;
        }

        h1 {
            margin-top: 5px;
            color: #e6d8dc;
            font-size: 28px;
            font-weight: 500;
        }

        .portrait {
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            margin: 25px auto;
            border: 1px solid #76616a;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 35px;
            padding-bottom: 5px;
            border-bottom: 1px solid #51494a;
            color: #cbaab5;
            font-size: 16px;
            font-weight: 500;
        }

        .info {
            font-size: 14px;
        }

        .label {
            color: #a58c95;
            display: inline-block;
            min-width: 85px;
        }

        .description {
            font-size: 14px;
            line-height: 2;
        }

        .bottom {
            margin-top: 50px;
            padding-top: 15px;
            border-top: 1px solid #51494a;
            text-align: center;
            font-size: 11px;
            color: #766d6e;
        }
    </style>
</head>

<body>
    <main class="container">

        <a class="back" href="index.html">← BACK TO TOP</a>

        <p class="file-number">CHARACTER FILE / 001</p>

        <h1>NAME_001</h1>

        <img
            class="portrait"
            src="無題891_20261015051345.png"
            alt="キャラクターの立ち絵"
        >

        <h2>PROFILE</h2>

        <div class="info">
            <p><span class="label">NAME</span> 名前を入力</p>
            <p><span class="label">AGE</span> 年齢を入力</p>
            <p><span class="label">HEIGHT</span> 身長を入力</p>
            <p><span class="label">GENDER</span> 性別を入力</p>
        </div>

        <h2>PERSONALITY</h2>

        <p class="description">
            ここにキャラクターの性格を書く。
            好きなものや嫌いなもの、普段の様子など。
        </p>

        <h2>BACKGROUND</h2>

        <p class="description">
            ここにキャラクターの過去や設定を書く。
            秘密にしておきたい情報を書くのもあり。
        </p>

        <div class="bottom">
            CHARACTER ARCHIVE
        </div>

    </main>
</body>
</html>
