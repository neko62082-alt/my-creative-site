<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY CREATIVE SITE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 30px;
            color: #d1cfca;
            font-family: "Zen Maru Gothic", sans-serif;
            line-height: 1.9;
            letter-spacing: 0.06em;

            background-color: #171716;
            background-image:
                radial-gradient(
                    ellipse at 20% 30%,
                    rgba(110, 105, 95, 0.18),
                    transparent 45%
                ),
                radial-gradient(
                    ellipse at 80% 70%,
                    rgba(90, 90, 85, 0.15),
                    transparent 40%
                ),
                repeating-linear-gradient(
                    125deg,
                    transparent 0px,
                    transparent 37px,
                    rgba(0, 0, 0, 0.18) 38px,
                    transparent 40px
                ),
                repeating-linear-gradient(
                    15deg,
                    #20201e 0px,
                    #20201e 3px,
                    #1b1b19 4px,
                    #20201e 7px
                );
        }

        h1 {
            color: #e6d8dc;
        }

        h2 {
            color: #cbaab5;
        }

        p {
            color: #c5c3bf;
        }

        /* キャラクター一覧 */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px 16px;
            max-width: 500px;
            margin: 30px auto;
        }

        /* キャラクター画像 */
        .character-card {
            display: block;
            text-decoration: none;
            transition: 0.3s;
        }

        .character-card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            box-sizing: border-box;
            border: 1px solid #76616a;
            box-shadow: 0 0 10px rgba(203, 170, 181, 0.12);
            transition: 0.3s;
        }

        .character-card:hover img {
            border-color: #cbaab5;
            box-shadow: 0 0 16px rgba(203, 170, 181, 0.35);
        }

        /* キャラクター名 */
        .character-name {
            display: block;
            margin-top: 8px;
            color: #cbaab5;
            font-size: 12px;
            text-align: center;
            letter-spacing: 0.12em;
            transition: 0.3s;
        }

        .character-card:hover .character-name {
            color: #f0dce3;
        }
    </style>
</head>

<body>

    <h1>MY CREATIVE SITE</h1>

    <p>創作キャラクター・世界観紹介サイト</p>

    <hr>

    <h2>ABOUT</h2>
    <p>ここは私の創作の世界を紹介するサイトです。</p>

    <h2>CHARACTERS</h2>
    <p>この世界に存在する人物の記録。</p>

    <div class="character-grid">
        <a href="無題891_20261015051345. html" class="character-card">
            <img src="無題891_20261015051345.png" alt="キャラクター">
            <span class="character-name">NAME_001</span>
        </a>
    </div>

    <h2>WORLD</h2>
    <p>物語の世界観や設定を紹介します。</p>

</body>
</html>
