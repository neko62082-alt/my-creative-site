<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY CREATIVE SITE</title>

    <style>
     
/* ===== キャラクター一覧 ===== */

.character-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px 16px;
    max-width: 700px;
    margin: 30px auto;
}
/* パソコンでは4列にする */
@media (min-width: 700px) {
    .character-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }

/* キャラクターカード */
.character-card {
    display: block;
    color: #d1cfca;
    text-decoration: none;
    min-width: 0;
}

/* 四角い画像 */
.character-card img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border: 1px solid #51494a;
    box-sizing: border-box;
    transition: border-color 0.25s,
                opacity 0.25s;
}

/* タップ・カーソル時の変化 */
.character-card:hover img {
    border-color: #cbaab5;
    opacity: 0.8;
}

/* キャラクター名 */
.character-name {
    display: block;
    margin-top: 9px;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: #cbaab5;
    text-align: center;
}
    </style>
</head>
 
    <h1>MY CREATIVE SITE</h1>

    <p>創作キャラクター・世界観紹介サイト</p>

    
    <h2>CHARACTERS</h2>

<p><h2>CHARACTERS</h2>
<p>この世界に存在する人物の記録。</p>

<div class="character-grid">
    <a href="character1.html" class="character-card">
        <img src="無題891_20261015051345.png" alt="キャラクター1">
        <span class="character-name">NAME_001</span>
    </a>
</div>
    <h2>WORLD</h2>
    <p>物語の世界観や設定を紹介します。</p>

</body>
</html>
