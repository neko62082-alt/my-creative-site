<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY CREATIVE SITE</title>

    <style>
        /* ページ全体 */
        body {
            background-color: #080808;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 0;
            padding: 30px 20px;
            line-height: 1.8;

     /* はっきり見える格子模様 */
background-image:
    linear-gradient(
        rgba(180, 180, 180, 0.18) 1px,
        transparent 1px
    ),
    linear-gradient(
        90deg,
        rgba(180, 180, 180, 0.18) 1px,
        transparent 1px
    );

background-size: 20px 20px;

        /* メインタイトル */
        h1 {
            color: #ffffff;
            letter-spacing: 4px;
            font-size: 28px;
        }

        /* 見出し */
        h2 {
            color: #aaaaaa;
            border-bottom: 1px solid #444444;
            padding-bottom: 5px;
            margin-top: 35px;
            letter-spacing: 2px;
        }

        /* 本文 */
        p {
            color: #bbbbbb;
        }

        /* 横線 */
        hr {
            border: none;
            border-top: 1px solid #333333;
            margin: 30px 0;
        }
    </style>
</head>

<body>

    <h1>MY CREATIVE SITE</h1>

    <p>創作キャラクター・世界観紹介サイト</p>

    <hr>

    <h2>ABOUT</h2>
    <p>ここは私の創作の世界を紹介するサイトです。</p>

    <h2>CHARACTERS</h2>
    <p>オリジナルキャラクターを紹介します。</p>

    <h2>WORLD</h2>
    <p>物語の世界観や設定を紹介します。</p>

</body>
</html>
