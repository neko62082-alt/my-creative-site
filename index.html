<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY CREATIVE SITE</title>

    <style>
        /* ページ全体 */
   body {
        /* 廃墟の壁のような背景 */
    background-color: #171716;

    background-image:
        radial-gradient(
            ellipse at 20% 30%,
            rgba(110, 105, 95, 0.18),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 80% 70%,
            rgba(90, 90, 85, 0.15),
            transparent 40%
        ),
        repeating-linear-gradient(
            125deg,
            transparent 0px,
            transparent 37px,
            rgba(0, 0, 0, 0.18) 38px,
            transparent 40px
        ),
        repeating-linear-gradient(
            15deg,
            #20201e 0px,
            #20201e 3px,
            #1b1b19 4px,
            #20201e 7px
        );
}
/* ===== キャラクター一覧 ===== */

.character-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px 16px;
    max-width: 700px;
    margin: 30px auto;
}

/* パソコンでは4列にする */
@media (min-width: 700px) {
    .character-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }
}

/* キャラクターカード */
.character-card {
    display: block;
    color: #d1cfca;
    text-decoration: none;
    min-width: 0;
}

/* 四角い画像 */
.character-card img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border: 1px solid #51494a;
    box-sizing: border-box;
    transition: border-color 0.25s,
                opacity 0.25s;
}

/* タップ・カーソル時の変化 */
.character-card:hover img {
    border-color: #cbaab5;
    opacity: 0.8;
}

/* キャラクター名 */
.character-name {
    display: block;
    margin-top: 9px;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: #cbaab5;
    text-align: center;
}
    </style>
</head>
 
    <h1>MY CREATIVE SITE</h1>

    <p>創作キャラクター・世界観紹介サイト</p>

    
    <h2>CHARACTERS</h2>

<p>この世界に存在する人物の記録。</p>

<div class="character-grid">

    <a href="character1.html" class="character-card">
        <img src="images/character1.jpg" alt="キャラクター1">
        <span class="character-name">NAME_001</span>
    </a>

    <a href="character2.html" class="character-card">
        <img src="images/character2.jpg" alt="キャラクター2">
        <span class="character-name">NAME_002</span>
    </a>

    <a href="character3.html" class="character-card">
        <img src="images/character3.jpg" alt="キャラクター3">
        <span class="character-name">NAME_003</span>
    </a>

    <a href="character4.html" class="character-card">
        <img src="images/character4.jpg" alt="キャラクター4">
        <span class="character-name">NAME_004</span>
    </a>

</div>

    <h2>WORLD</h2>
    <p>物語の世界観や設定を紹介します。</p>

</body>
</html>
