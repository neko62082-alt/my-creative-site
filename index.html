<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY CREATIVE SITE</title>

    <style>
    body {
    margin: 0;
    padding: 30px;

    color: #d1cfca;
    font-family: "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", sans-serif;
    line-height: 1.9;
    letter-spacing: 0.06em;

    /* 廃墟の壁のような背景 */
    background-color: #171716;

    background-image:
        radial-gradient(
            ellipse at 20% 30%,
            rgba(110, 105, 95, 0.18),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 80% 70%,
            rgba(90, 90, 85, 0.15),
            transparent 40%
        ),
        repeating-linear-gradient(
            125deg,
            transparent 0px,
            transparent 37px,
            rgba(0, 0, 0, 0.18) 38px,
            transparent 40px
        ),
        repeating-linear-gradient(
            15deg,
            #20201e 0px,
            #20201e 3px,
            #1b1b19 4px,
            #20201e 7px
        );
/* キャラクター一覧 */
.character-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px 16px;
    max-width: 500px;
    margin: 30px auto;
}

/* 四角い画像 */
.character-card img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    box-sizing: border-box;
    border: 1px solid #51494a;
}

/* キャラクター名 */
.character-name {
    display: block;
    margin-top: 8px;
    color: #cbaab5;
    font-size: 12px;
    text-align: center;
    letter-spacing: 0.12em;
}
    </style>
</head>
 
    <h1>MY CREATIVE SITE</h1>

    <p>創作キャラクター・世界観紹介サイト</

    <p><h2>CHARACTERS</h2>
<p>この世界に存在する人物の記録。</p>

<div class="character-grid">
    <a href="character1.html" class="character-card">
        <img src="無題891_20261015051345.png" alt="キャラクター1">
        <span class="character-name">NAME_001</span>
    </a>
</div>
    <h2>WORLD</h2>
    <p>物語の世界観や設定を紹介します。</p>

</body>
</html>
